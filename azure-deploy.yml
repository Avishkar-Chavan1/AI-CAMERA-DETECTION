trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'acr-connection'
  imageRepository: 'industrial-safety-ai'
  containerRegistry: '$(acrName).azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/docker/Dockerfile.api'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push
  jobs:
  - job: BuildImage
    displayName: Build Docker Image
    steps:
    - task: Docker@2
      displayName: Build image
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistryType: Azure Container Registry
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
    
    - task: Docker@2
      displayName: Push image to registry
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistryType: Azure Container Registry
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceSettings@1
            inputs:
              azureSubscription: 'Azure Connection'
              appName: 'industrial-safety-ai'
              resourceGroupName: 'rg-industrial-safety'
              appSettings: |
                [
                  {
                    "name": "DOCKER_REGISTRY_SERVER_URL",
                    "value": "https://$(containerRegistry)",
                    "slotSetting": false
                  },
                  {
                    "name": "DOCKER_REGISTRY_SERVER_USERNAME",
                    "value": "$(acrUsername)",
                    "slotSetting": false
                  },
                  {
                    "name": "DOCKER_REGISTRY_SERVER_PASSWORD",
                    "value": "$(acrPassword)",
                    "slotSetting": false
                  },
                  {
                    "name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE",
                    "value": "false",
                    "slotSetting": false
                  },
                  {
                    "name": "APP_ENV",
                    "value": "production",
                    "slotSetting": false
                  },
                  {
                    "name": "LOG_JSON",
                    "value": "true",
                    "slotSetting": false
                  },
                  {
                    "name": "API_AUTH_ENABLED",
                    "value": "true",
                    "slotSetting": false
                  },
                  {
                    "name": "LOG_LEVEL",
                    "value": "INFO",
                    "slotSetting": false
                  }
                ]
          
          - task: AzureRmWebAppDeployment@4
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'Azure Connection'
              appType: 'webAppContainer'
              WebAppName: 'industrial-safety-ai'
              deployToSlotOrASE: false
              imageName: '$(containerRegistry)/$(imageRepository):latest'
              multipleStartupFiles: false
