[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-safety-ai"
version = "0.2.0"
description = "Industrial AI safety monitoring platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "streamlit>=1.38,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10,<5.0",
    "ultralytics>=8.3,<9.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
safety-api = "backend.app.cli:run"
safety-vision = "vision.cli:run"

[tool.setuptools.packages.find]
include = ["backend*", "vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "dashboard", "tests", "vision"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
