services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      API_HOST: 0.0.0.0
      API_PORT: ${PORT:-8000}
      PORT: ${PORT:-8000}
      MODEL_PATH: ${MODEL_PATH:-best.pt}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["http://localhost:8501","http://127.0.0.1:8501"]}
      API_MAX_IMAGE_BYTES: ${API_MAX_IMAGE_BYTES:-20000000}
      API_MAX_VIDEO_BYTES: ${API_MAX_VIDEO_BYTES:-500000000}
      API_MAX_VIDEO_FRAMES: ${API_MAX_VIDEO_FRAMES:-10000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-30}
      API_RATE_WINDOW_SECONDS: ${API_RATE_WINDOW_SECONDS:-60}
      API_INFERENCE_TIMEOUT_SECONDS: ${API_INFERENCE_TIMEOUT_SECONDS:-300}
      API_EVENT_LOG_PATH: ${API_EVENT_LOG_PATH:-runs/inference/events.db}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/api/v1/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - ./runs/inference:/app/runs/inference
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

  dashboard:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      MODEL_PATH: ${MODEL_PATH:-best.pt}
      API_KEY: ${API_KEY:-}
      API_REQUEST_TIMEOUT_SECONDS: ${API_REQUEST_TIMEOUT_SECONDS:-300}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    volumes:
      - ./runs/inference:/app/runs/inference
