services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
